name: Android APK Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install .NET Android workload
        run: dotnet workload install android
        working-directory: ${{ runner.temp }}
      - name: Build signed APK
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          dotnet publish "$GITHUB_WORKSPACE/android/Dartsview.Android.csproj" -c Release -f net8.0-android34.0 -p:AndroidPackageFormat=apk
          apk="$(find "$GITHUB_WORKSPACE/android/bin/Release/net8.0-android34.0" -type f -name '*-Signed.apk' -print -quit)"
          test -n "$apk" || { echo "::error::The signed APK was not produced"; exit 1; }
          cp "$apk" "$GITHUB_WORKSPACE/Dartsview.apk"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dartsview ${{ github.sha }}
          tag_name: build-${{ github.sha }}
          generate_release_notes: true
          files: Dartsview.apk
          body: |
            Auto-generated APK from commit ${{ github.sha }}
            Built on ${{ github.event.head_commit.timestamp }}
            This APK is signed with the Android debug key and intended for testing purposes.
          draft: false
          prerelease: true