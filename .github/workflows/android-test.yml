name: Android test APK

on:
  push:
    tags:
      - "v*-test"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install .NET Android workload
        run: dotnet workload install android
        working-directory: ${{ runner.temp }}
      - name: Build test APK
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          dotnet publish "$GITHUB_WORKSPACE/android/Dartsview.Android.csproj" -c Release -f net10.0-android36.0 -p:AndroidPackageFormat=apk
          apk="$(find "$GITHUB_WORKSPACE/android/bin/Release/net10.0-android36.0" -type f -name '*-Signed.apk' -print -quit)"
          test -n "$apk" || { echo "::error::The test APK was not produced"; exit 1; }
          cp "$apk" "$GITHUB_WORKSPACE/Dartsview-test.apk"
      - name: Attach test APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Dartsview ${{ github.ref_name }} (Test APK)
          generate_release_notes: true
          files: Dartsview-test.apk
          body: |
            Device-testing APK signed with the Android debug key.
            This APK is not suitable for Google Play or reliable in-place upgrades.
